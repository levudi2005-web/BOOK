# =====================================================================
# BOOKFORFREEDOM - ISOLATED TEST STACK (never touches production)
# ---------------------------------------------------------------------
#   docker compose -f docker-compose.test.yml -p bff-test up -d --wait
#   pnpm --filter @bff/api test
#   docker compose -f docker-compose.test.yml -p bff-test down -v
#
# Separate project name (`bff-test`), separate volume and separate ports
# (MariaDB 3308, Meilisearch 7701) so it can run next to the production
# containers without any shared state.
# =====================================================================
services:
  mariadb-test:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${TEST_MARIADB_ROOT_PASSWORD:-test-root-password}
      BOOKUSER_DB_USER: ${TEST_BOOKUSER_DB_USER:-app_bookuser}
      BOOKUSER_DB_PASSWORD: ${TEST_BOOKUSER_DB_PASSWORD:-test-bookuser-password}
      BOOKADMIN_DB_USER: ${TEST_BOOKADMIN_DB_USER:-app_bookadmin}
      BOOKADMIN_DB_PASSWORD: ${TEST_BOOKADMIN_DB_PASSWORD:-test-bookadmin-password}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mariadb_test_data:/var/lib/mysql
      - ./database/sql:/opt/bookfreedom/sql:ro
      - ./infra/docker/mariadb/init.sh:/docker-entrypoint-initdb.d/10-bookfreedom.sh:ro
      - ./infra/docker/mariadb/test-migrations.sh:/docker-entrypoint-initdb.d/20-test-migrations.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  meilisearch-test:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${TEST_MEILI_MASTER_KEY:-test-meili-master-key}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      TZ: UTC
    ports:
      - "127.0.0.1:7701:7700"
    volumes:
      - meilisearch_test_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mariadb_test_data:
  meilisearch_test_data:
